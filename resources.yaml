---

resources:
  build/native-build-tools:
    phases: native:install,install
    version: latest
    path: $ROTOOL_DIR

  build/root-env:
    phases: install
    version: latest
    path: $ROBUILD_DIR/Env

exports:
  build/cross/basictokenise:
    phases: native:install
    upload: false
    path: $ROTOOL_DIR
    files:
      - riscos-basictokenise
      - Help/riscos-basictokenise

  library/basictokenise:
    phases: install
    newer: true
    path: $INSTALL_DIR/Library
